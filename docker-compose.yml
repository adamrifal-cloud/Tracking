networks:
  logistik-network:
    driver: bridge

services:
  # =========================================================================
  # BLOK 1: TRACKING SERVICE
  # =========================================================================
  tracking-app:
    build: ./tracking-service
    container_name: tracking-service-app
    ports:
      - "8001:8000"
      - "5273:5173"
    volumes:
      - ./tracking-service:/app
    depends_on:
      tracking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - logistik-network

  tracking-queue:
    build: ./tracking-service
    container_name: tracking-service-queue
    volumes:
      - ./tracking-service:/app
    command: php artisan rabbitmq:listen-allocation
    depends_on:
      tracking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - logistik-network

  tracking-reverb:
    build: ./tracking-service
    container_name: tracking-service-reverb
    ports:
      - "8080:8080"
    volumes:
      - ./tracking-service:/app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - logistik-network

  tracking-db:
    image: mysql:8.0
    container_name: tracking-service-db
    ports:
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tracking_db
      MYSQL_INITIALIZATON_FILES_PATH: /docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15s
    networks:
      - logistik-network

  # =========================================================================
  # BLOK 2: VENDOR SERVICE
  # =========================================================================
  vendor-app:
    build: ./vendor-service
    container_name: vendor-service-app
    ports:
      - "8002:8000"
    volumes:
      - ./vendor-service:/app
    depends_on:
      vendor-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - logistik-network

  vendor-db:
    image: mysql:8.0
    container_name: vendor-service-db
    ports:
      - "33062:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vendor_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15s
    networks:
      - logistik-network

  # =========================================================================
  # MESSAGE BROKER (RABBITMQ)
  # =========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: logistik-message-broker
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - logistik-network
